name: "CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend Quality & i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      - name: Run ESLint
        run: bun run lint

      - name: Run Prettier formatter check
        run: bun run format:check

      - name: Run TypeScript typecheck
        run: bunx tsc --noEmit

  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # .cargo/config.toml wraps rustc + CMake compilers with sccache.
      - name: Install sccache (Rust/C++ compiler cache)
        run: |
          set -euo pipefail
          VERSION="0.17.0"
          curl -L --fail --retry 3 -o sccache.tgz \
            "https://github.com/mozilla/sccache/releases/download/v${VERSION}/sccache-v${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar xzf sccache.tgz
          mkdir -p "$HOME/.cargo/bin"
          cp "sccache-v${VERSION}-x86_64-unknown-linux-musl/sccache" "$HOME/.cargo/bin/"
          chmod +x "$HOME/.cargo/bin/sccache"

      # transcribe-cpp compiles ggml-vulkan on Linux (dynamic-backends +
      # vulkan features), which needs a Vulkan SDK (glslc) at build time.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.335.0
          cache: true

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

  e2e-tests:
    name: Playwright E2E Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps
      - name: Run Playwright Tests
        run: bun run test:playwright
