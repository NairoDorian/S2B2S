name: "test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
  pull_request:
    paths:
      - "src-tauri/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libvulkan-dev + glslc + spirv-headers are what ggml's Vulkan backend
          # needs to configure and compile: this fork's Linux target enables
          # transcribe-cpp's `vulkan` feature beside `cuda`
          # (src-tauri/Cargo.toml), so -DTRANSCRIBE_VULKAN=ON does build here,
          # shader-gen and all. They are what upstream's Vulkan CI installed,
          # and they are load-bearing here rather than a leftover — see the
          # SPIRV notes in build.yml for the same dependency elsewhere.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The same command the local precommit:full gate runs. Warnings are
      # visible in the log but do not fail the job — the gate has not gated
      # on clippy warnings, so CI staying advisory keeps the two in step
      # until the existing set is cleaned up.
      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: Run Rust tests
        working-directory: src-tauri
        # --all-targets: the same target set the local gate runs
        # (package.json's test:backend), so unit tests compile too.
        run: cargo test --all-targets
