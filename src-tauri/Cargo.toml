[package]
name = "s2b2s"
version = "0.1.4"
description = "S2B2S - SpeechToBrainToSpeech"
authors = ["NairoDorian"]
edition = "2021"
rust-version = "1.87"
license = "MIT"
default-run = "s2b2s"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "s2b2s_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
overlay-native = []

[build-dependencies]
tauri-build = { version = "*", features = [] }
serde_json = "*"
serde = { version = "*", features = ["derive"] }

[dependencies]
once_cell = "*"
tauri = { version = "*", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "*"
tauri-plugin-opener = "*"
tauri-plugin-store = "*"
tauri-plugin-os = "*"
tauri-plugin-clipboard-manager = "*"
tauri-plugin-macos-permissions = "*"
tauri-plugin-process = "*"
rusqlite_migration = "*"
tauri-plugin-fs = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
# Pinned to 0.17 (latest usable): rodio 0.22 requires cpal ^0.17, and a single
# cpal version is mandatory because audio_feedback hands a cpal Device to rodio.
cpal = "0.17"
anyhow = "1.0.103"
rubato = "3.0.0"
# rubato 3.0 exposes audio I/O through these adapter crates (same version rubato uses).
audioadapter = "3.0"
audioadapter-buffers = "3.0"
hound = "*"
log = "*"
env_filter = "*"
tokio = "*"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
# Direct deps for native Silero v6.x ONNX engine (already transitive via vad-rs / transcribe-rs)
ort = { version = "=2.0.0-rc.12", features = [] }
ndarray = { version = "=0.17.2" }
enigo = "*"
rodio = "0.22"
reqwest = { version = "*", features = ["json", "stream", "blocking", "gzip", "brotli", "deflate"] }
ureq = "*"
futures-util = "*"
rustfft = "*"
strsim = "*"
natural = "*"
regex = "*"
# Text-based language ID (filler-word removal fallback); isolang bridges the
# ISO 639-1 codes in model metadata to whatlang's 639-3 codes.
whatlang = "*"
isolang = "*"
chrono = "*"
rusqlite = { version = "*", features = ["bundled"] }
nnnoiseless = { version = "*", default-features = false }
tar = "*"
flate2 = "*"
sha2 = "*"
# Whisper-family models run through transcribe-cpp (GGUF/ggml, native backends);
# transcribe-rs is now ONNX-only (Parakeet, Moonshine, SenseVoice, GigaAM,
# Canary, Cohere). Per-platform backend features are added in the target tables.
transcribe-rs = { version = "*", features = ["onnx"] }
transcribe-cpp = { version = "*", default-features = false }
handy-keys = "*"
ferrous-opencc = "*"
clap = { version = "*", features = ["derive"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-dialog = "*"
text-processing-rs = "*"
base64 = "*"
getrandom = "*"
keyring = "*"
aes-gcm = "*"
aead = "*"
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = [
  "tokio",
] }

[target.'cfg(unix)'.dependencies]
signal-hook = "*"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "*"
tauri-plugin-global-shortcut = "*"
tauri-plugin-single-instance = "*"
tauri-plugin-updater = "*"

[target.'cfg(windows)'.dependencies]
windows-core-061 = { package = "windows-core", version = "0.61" }
windows-core = "0.62.2"
webview2-com = "*"
windows = { version = "*", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Wdk_Graphics_Direct3D",
  "Win32_Media_Speech",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
] }
winreg = "*"

# Whisper backend per Windows arch.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "*", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "*", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-cpp = { version = "*", default-features = false, features = ["metal"] }
# Used by the receipt-sequenced ("reliable") paste path for lazy NSPasteboard
# promises. Versions track what Tauri already pulls in.
objc2 = "*"
objc2-foundation = "*"
objc2-app-kit = "*"
objc2-service-management = "*"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "*", features = ["v0_6"] }
gtk = "*"
libc = "*"
transcribe-cpp = { version = "*", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

# TEMPORARY: tao pinned past 0.35.3 for the Wayland client-side-decorations fix
# (tao #1218, fixes tauri #11856 — dead titlebar buttons after visible(false) →
# show()). Drop this once a tao release containing it lands in tauri.
[patch.crates-io]
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp", branch = "main" }
transcribe-cpp-sys = { git = "https://github.com/handy-computer/transcribe.cpp", branch = "main" }
tao = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }
tao-macros = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }

[dev-dependencies]
tempfile = "*"
# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "*", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
