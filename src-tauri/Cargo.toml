[package]
name = "zer0"
version = "0.9.7"
description = "ZER0 — real-time speech to text"
authors = ["NairoDorian"]
edition = "2024"
license = "MIT"
default-run = "zer0"

[profile.dev]
incremental = true

# A fixed `app_lib`, deliberately NOT derived from the package name: the
# library name is structural, not identity. Every `use` in `main.rs` and in
# `tests/` would otherwise be a hardcoded copy of the product name that a
# rename would have to chase, and Rust has no way to write a `use` path from a
# constant. A distinct name from the binary target also avoids the collision
# the bare package name would cause on some platforms.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.1", features = [] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }

[dependencies]
once_cell = "1.21.4"
tauri = { version = "3.0.0-alpha.2", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
# In Tauri 3 the runtime lives in a separate crate; `tauri::Builder::default()`
# is generic over `tauri_runtime::Runtime` and defaults to the type-erased
# `DynRuntime`. The Wry runtime type (`WryRuntime`) and the `Wry` runtime
# initializer both live here. Published on crates.io; enabling
# `macos-private-api` mirrors the same feature on the `tauri` crate so the macOS
# private-API window functionality (transparent windows, full-screen
# enablement) is available.
tauri-runtime-wry = { version = "3.0.0-alpha.2", features = ["macos-private-api"] }
# Every `tauri-plugin-*` comes from Tauri's own `plugins-workspace`, `v3`
# branch — the canonical source, tracked at the branch tip so a `cargo update`
# always takes the newest v3 alpha. Not from crates.io: the published plugin
# crates stop at 3.0.0-alpha.0, which still calls `Builder::js_init_script`, and
# `tauri 3.0.0-alpha.2` renamed that to `initialization_script`. The v3 branch
# is at 3.0.0-alpha.1 and speaks the alpha.2 API, so it is the only published
# line that compiles against the core above. `tauri-plugin-macos-permissions`
# is the exception — it is a community plugin with no v3 release at all, so it
# stays on its fork.
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-os = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-clipboard-manager = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-process = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
rusqlite_migration = "2.6.0"
tauri-plugin-fs = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "^0.18.2"
rtrb = "0.4.0"
anyhow = "1.0.104"
rubato = "^5.0.0"
hound = "3.5.1"
# Decodes MP3 / M4A / FLAC / OGG / multi-channel WAV for the "Transcribe Files"
# page. Same crate + features rodio already pulls in, so no new transitive deps.
symphonia = { version = "^0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm"] }
log = "^0.4.34"
env_filter = "2.0.0"
tokio = "1.53.1"
# Voice activity detection: pure Rust, no model file, no native runtime.
earshot = "1.2.2"
# RNNoise noise suppression (pure-Rust port, weights compiled in). Default
# features pull a CLI + dasp; only the DenoiseState API is needed.
nnnoiseless = { version = "0.5.2", default-features = false }
# In-app llama.cpp server manager: release archives are unpacked with the
# pure-Rust zip crate (no PowerShell / tar shell-outs).
zip = { version = "^9.0.0-pre3", default-features = false, features = ["deflate"] }
# Status-bar meters: one sampler thread, CPU + RAM from sysinfo, GPU from NVML
# when the NVIDIA driver library is present (loaded at runtime, optional).
sysinfo = { version = "^0.39.6", default-features = false, features = ["system"] }
nvml-wrapper = "0.13"
enigo = "0.6.1"
rodio = { git = "https://github.com/RustAudio/rodio" }
reqwest = { version = "^0.13.5", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures-util = "^0.3.34"
rustfft = "6.4.1"
# Live FFT page: real-to-complex transform on top of rustfft. Already a
# transitive dependency of rubato, so no new crate is compiled.
realfft = "3.5.0"
strsim = "0.11.1"
natural = "0.5.0"
regex = "1.13.1"
# Text-based language ID (filler-word removal fallback); isolang bridges the
# ISO 639-1 codes in model metadata to whatlang's 639-3 codes.
whatlang = "^0.18.0"
isolang = "^2.4.0"
chrono = "0.4.45"
rusqlite = { version = "^0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
# Every model (Whisper family, Parakeet, Moonshine, Canary, … as GGUF) runs
# through transcribe-cpp (ggml, native backends). Per-platform backend features
# are added in the target tables below.
transcribe-cpp = { version = "*", default-features = false }
handy-keys = "^0.3.4"
ferrous-opencc = "0.4.0"
clap = { version = "^4.6.7", features = ["derive"] }
specta = "2.0.0-rc.26"
specta-typescript = "0.0.13"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
hf-hub = { git = "https://github.com/huggingface/hf-hub", branch = "main" }
tokio-util = "^0.7.19"
dirs = "^7.0.0"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
rand = "^0.10.3"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-global-shortcut = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }

[target.'cfg(windows)'.dependencies]
# Used to reach ICoreWebView2Settings3 through the webview's controller
# (disabling browser accelerator keys in the main window, upstream #1940).
# Must match the version tauri-runtime-wry links against so the COM types
# are identical — both depend on the same windows-core instance.
webview2-com = "^0.39.1"
# windows-core 0.62 — same minor as what wry 0.57 + webview2-com 0.39 bring
# in, so there is a single windows-core version in the graph and the
# COM `Interface` trait resolves for both our imports and the controller().
# (tauri itself still uses windows 0.61, which is a separate crate and
# does not share COM types with our webview2-com interop.)
windows-core = "0.62"
windows = { version = "^0.62.2", features = [
  "Win32_Media",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
] }
winreg = "0.56.0"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
# The model architectures are compiled into libtranscribe rather than shipped as
# loadable `transcribe-arch-<family>.dll` modules: the `arch-dl` module split is
# switched off for now, and so is the family-set selection — every lane packs
# the full set, so one build carries every model and `TRANSCRIBE_MODEL_SET` is
# not a per-lane knob. See scripts/tauri-runner.ts.
#
# `dynamic-backends` stays: that is a different mechanism (ggml backend modules
# — the CPU ISA tiers and `ggml-cuda`), and it is what lets one binary serve a
# CUDA device and a CPU device in the same process. It implies `shared`.
transcribe-cpp = { version = "*", default-features = false, features = [
  "dynamic-backends",
  "cuda",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "*", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "*", default-features = false, features = ["metal"] }
objc2 = "^0.6.4"
objc2-foundation = "^0.3.2"
objc2-app-kit = "^0.3.2"
objc2-service-management = "0.3.2"
core-graphics = "^0.25.0"
core-foundation = "^0.10.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
gtk = "^0.18.2"
# Stays on 0.2: the libc README says to depend on 0.2, the 1.0.0-alpha.*
# tags are v1.0 branch snapshots, and every other crate here uses 0.2 (a
# second libc would be compiled on Linux). update-deps.ts knows this.
libc = "^0.2.189"
# Same posture as Windows x86_64 above: architectures are compiled in on every
# platform (no `arch-dl` anywhere), so every model works — there is just no
# plugin directory to swap a family in or out of.
transcribe-cpp = { version = "*", default-features = false, features = [
  "dynamic-backends",
  "cuda",
] }

# TEMPORARY: tao pinned to upstream tauri-apps/tao `main` for the Wayland
# client-side-decorations fix (tao #1218, fixes tauri #11856 — dead titlebar
# buttons after visible(false) → show()) and the thread event target shutdown
# fix (tao #1274 / upstream #1710). The patched tree is tao **0.37.0**, which is
# what `tauri-runtime-wry 3.0.0-alpha.2` requires (`tao ^0.37.0`), so the patch
# no longer pins past its consumer's constraint — it tracks `main` for the two
# fixes above.
# tao-macros must be patched to the SAME rev even though nothing here depends on
# it directly: wry pulls tao-macros 0.1.3 from crates.io, so without this the
# lockfile carries two tao-macros 0.1.3 entries (registry + git). cargo tolerates
# that, but Nix's importCargoLock vendors both to the same `tao-macros-0.1.3`
# dir and fails with a symlink collision. Unifying the source removes the dup.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao" }
tao-macros = { git = "https://github.com/tauri-apps/tao" }
# The tauri crates are NOT patched: they resolve from crates.io at the versions
# `[dependencies]` above asks for. They were briefly patched from a v3 fork that
# carried one commit — bumping tauri-runtime-wry's wry dependency from 0.56 to
# 0.57 (webview2-com 0.38→0.39, windows 0.61→0.62) ahead of the release. That
# bump is upstream now: published `tauri-runtime-wry 3.0.0-alpha.2` links
# `wry ^0.57.0`, `webview2-com ^0.39` and `windows ^0.62`, which is exactly what
# the fork's commit made it link, so the fork is obsolete and the patch is gone.
# The Windows `webview2-com` / `windows-core` pins below stay valid against it.
tauri-specta = { git = "https://github.com/NairoDorian/tauri-specta-v3" }
tauri-plugin-macos-permissions = { git = "https://github.com/NairoDorian/tauri-plugin-macos-permissions" }
transcribe-cpp = { git = "https://github.com/NairoDorian/transcribe.cpp", branch = "main" }
specta = { git = "https://github.com/specta-rs/specta.git", branch = "main" }
specta-macros = { git = "https://github.com/specta-rs/specta.git", branch = "main" }
specta-serde = { git = "https://github.com/specta-rs/specta.git", branch = "main" }
specta-typescript = { git = "https://github.com/specta-rs/specta.git", branch = "main" }
specta-util = { git = "https://github.com/specta-rs/specta.git", branch = "main" }
transcribe-cpp-sys = { git = "https://github.com/NairoDorian/transcribe.cpp", branch = "main" }

[dev-dependencies]
tempfile = "3.27.0"
# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "1.53.1", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
panic = "unwind"

# Earshot is pure Rust; keep it optimised in dev builds so a debug app (and
# tests/vad_speech_clock_probe.rs) measure the real VAD cost, not an
# unoptimised one.
[profile.dev.package.earshot]
opt-level = 3
