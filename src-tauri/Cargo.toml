[package]
name = "zer0"
version = "0.9.7"
description = "ZER0 — real-time speech to text"
authors = ["NairoDorian"]
edition = "2024"
license = "MIT"
default-run = "zer0"

[profile.dev]
incremental = true

# A fixed `app_lib`, deliberately NOT derived from the package name: the
# library name is structural, not identity. Every `use` in `main.rs` and in
# `tests/` would otherwise be a hardcoded copy of the product name that a
# rename would have to chase, and Rust has no way to write a `use` path from a
# constant. A distinct name from the binary target also avoids the collision
# the bare package name would cause on some platforms.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }

[dependencies]
once_cell = "1.21.4"
tauri = { version = "2.11.5", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "^2.9.1"
tauri-plugin-opener = "^2.5.5"
tauri-plugin-store = "2.4.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "^2.3.3"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.6.0"
tauri-plugin-fs = "^2.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "^0.18.2"
rtrb = "0.4.0"
anyhow = "1.0.104"
rubato = "^5.0.0"
hound = "3.5.1"
# Decodes MP3 / M4A / FLAC / OGG / multi-channel WAV for the "Transcribe Files"
# page. Same crate + features rodio already pulls in, so no new transitive deps.
symphonia = { version = "^0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm"] }
log = "^0.4.34"
env_filter = "2.0.0"
tokio = "1.53.1"
# Voice activity detection: pure Rust, no model file, no native runtime.
earshot = "1.2.2"
# RNNoise noise suppression (pure-Rust port, weights compiled in). Default
# features pull a CLI + dasp; only the DenoiseState API is needed.
nnnoiseless = { version = "0.5.2", default-features = false }
# In-app llama.cpp server manager: release archives are unpacked with the
# pure-Rust zip crate (no PowerShell / tar shell-outs).
zip = { version = "^9.0.0-pre3", default-features = false, features = ["deflate"] }
# Status-bar meters: one sampler thread, CPU + RAM from sysinfo, GPU from NVML
# when the NVIDIA driver library is present (loaded at runtime, optional).
sysinfo = { version = "^0.39.6", default-features = false, features = ["system"] }
nvml-wrapper = "0.13"
enigo = "0.6.1"
rodio = { git = "https://github.com/RustAudio/rodio" }
reqwest = { version = "^0.13.5", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures-util = "^0.3.34"
rustfft = "6.4.1"
# Live FFT page: real-to-complex transform on top of rustfft. Already a
# transitive dependency of rubato, so no new crate is compiled.
realfft = "3.5.0"
strsim = "0.11.1"
natural = "0.5.0"
regex = "1.13.1"
# Text-based language ID (filler-word removal fallback); isolang bridges the
# ISO 639-1 codes in model metadata to whatlang's 639-3 codes.
whatlang = "^0.18.0"
isolang = "^2.4.0"
chrono = "0.4.45"
rusqlite = { version = "^0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
# Every model (Whisper family, Parakeet, Moonshine, Canary, … as GGUF) runs
# through transcribe-cpp (ggml, native backends). Per-platform backend features
# are added in the target tables below.
transcribe-cpp = { version = "*", default-features = false }
handy-keys = "^0.3.4"
ferrous-opencc = "0.4.0"
clap = { version = "^4.6.6", features = ["derive"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-dialog = "^2.7.3"
hf-hub = { git = "https://github.com/huggingface/hf-hub", branch = "main" }
tokio-util = "^0.7.19"
dirs = "^7.0.0"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
rand = "0.10.2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "^2.4.4"
tauri-plugin-updater = "^2.11.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Media",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
# `arch-dl` builds each model architecture as a loadable `transcribe-arch-<family>.dll`
# beside libtranscribe instead of compiling it into the core, so ONE build serves
# any model set and a family can be added or swapped without relinking. WHICH
# families get built is `TRANSCRIBE_MODEL_SET` (minimal-multilingual = parakeet,
# granite, qwen3_asr; full = all 18) — a native-build knob, not a cargo feature,
# so `bun run tauri dev` and `bun run tauri build:full` share this manifest and
# differ only in environment. See scripts/tauri-runner.ts and .cargo/config.toml.
#
# It implies `shared` (the plugins resolve symbols out of libtranscribe at load
# time), which `dynamic-backends` already requires here, so this changes nothing
# about the linking posture — it only moves architectures out of the core.
transcribe-cpp = { version = "*", default-features = false, features = [
  "dynamic-backends",
  "arch-dl",
  "cuda",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "*", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-cpp = { version = "*", default-features = false, features = ["metal"] }
# Used by the receipt-sequenced ("reliable") paste path for lazy NSPasteboard
# promises. Versions track what Tauri already pulls in.
objc2 = "^0.6.4"
objc2-foundation = "^0.3.2"
objc2-app-kit = "^0.3.2"
objc2-service-management = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
gtk = "^0.18.2"
# Stays on 0.2: the libc README says to depend on 0.2, the 1.0.0-alpha.*
# tags are v1.0 branch snapshots, and every other crate here uses 0.2 (a
# second libc would be compiled on Linux). update-deps.ts knows this.
libc = "^0.2.189"
# Same posture as Windows x86_64 above, `arch-dl` included. macOS and Windows
# aarch64 stay static (no `arch-dl`): they do not build a shared libtranscribe,
# so architectures remain compiled in there — every model still works, there is
# just no plugin directory to swap.
transcribe-cpp = { version = "*", default-features = false, features = [
  "dynamic-backends",
  "arch-dl",
  "cuda",
] }

# TEMPORARY: tao pinned past 0.35.3 for the Wayland client-side-decorations fix
# (tao #1218, fixes tauri #11856 — dead titlebar buttons after visible(false) →
# show()) and the thread event target shutdown fix (tao #1274 / upstream #1710).
# Pinned to upstream tauri-apps/tao rev da7441aa (where #1274 merged, compatible
# with Tauri 2.x's tao 0.35.x constraint).
# tao-macros must be patched to the SAME rev even though nothing here depends on
# it directly: wry pulls tao-macros 0.1.3 from crates.io, so without this the
# lockfile carries two tao-macros 0.1.3 entries (registry + git). cargo tolerates
# that, but Nix's importCargoLock vendors both to the same `tao-macros-0.1.3`
# dir and fails with a symlink collision. Unifying the source removes the dup.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao" }
tao-macros = { git = "https://github.com/tauri-apps/tao" }
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
transcribe-cpp = { git = "https://github.com/NairoDorian/transcribe.cpp", branch = "main" }
transcribe-cpp-sys = { git = "https://github.com/NairoDorian/transcribe.cpp", branch = "main" }

[dev-dependencies]
tempfile = "3.27.0"
# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "1.53.1", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
panic = "unwind"

# Earshot is pure Rust; keep it optimised in dev builds so a debug app (and
# tests/vad_speech_clock_probe.rs) measure the real VAD cost, not an
# unoptimised one.
[profile.dev.package.earshot]
opt-level = 3
