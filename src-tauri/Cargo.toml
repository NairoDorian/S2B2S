[package]
name = "zer0"
version = "0.9.7"
description = "ZER0 — real-time speech to text"
authors = ["NairoDorian"]
edition = "2024"
license = "MIT"
default-run = "zer0"

[profile.dev]
incremental = true

# A fixed `app_lib`, deliberately NOT derived from the package name: the
# library name is structural, not identity. Every `use` in `main.rs` and in
# `tests/` would otherwise be a hardcoded copy of the product name that a
# rename would have to chase, and Rust has no way to write a `use` path from a
# constant. A distinct name from the binary target also avoids the collision
# the bare package name would cause on some platforms.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# The whole Tauri family is pinned with `=`, and it has to move as a SET rather
# than one crate at a time. A requirement like `3.0.0-alpha.4` reads as
# `>=3.0.0-alpha.4, <3.0.0`, so a bare `cargo update` unifies the family forward
# on its own, and a family split across two releases resolves and then fails to
# compile (or `tauri-build` rejects `tauri.conf.json` against a newer
# `tauri-utils` schema) with an error naming none of the crates to look at. The
# `@tauri-apps/cli` in package.json is the same release as `tauri` for the same
# reason: it validates `tauri.conf.json` before cargo runs.
#
# Current set (2026-11-15, the newest published): `tauri` / `tauri-runtime-wry`
# alpha.6, `tauri-runtime` alpha.5, `tauri-build` / `tauri-codegen` /
# `tauri-utils` / `tauri-macros` / `tauri-plugin` alpha.4. The `v3` plugins
# branch requires `tauri >= 3.0.0-alpha.4`, so plugins and core agree again
# (alpha.2 → alpha.6 was blocked from alpha.3 to 2026-11-03 by plugins still
# calling the removed inherent `run_on_main_thread`). To move the set, bump every
# `=` here and in `[dependencies]` in one edit, then `@tauri-apps/cli`.
tauri-build = { version = "=3.0.0-alpha.4", features = [] }
# Pulled by tauri-build; pinned here for the same reason (it is what carries the
# config schema tauri-build validates against).
tauri-codegen = "=3.0.0-alpha.4"
serde_json = "^1.0.154"

[dependencies]
once_cell = "1.21.4"
# The OS's preferred languages (system_languages.rs). Already in the graph
# through tauri-plugin-os, so no new crate is compiled.
sys-locale = "^0.3.2"
# `=` on the Tauri family is load-bearing — see the note in
# `[build-dependencies]` above. `macos-private-api` is gone: core alpha.4
# (b9a77ebb) removed the feature and the `app > macOSPrivateApi` config option,
# because window transparency and `fullScreenEnabled` no longer need macOS
# private APIs.
tauri = { version = "=3.0.0-alpha.6", features = [
  "protocol-asset",
  "tray-icon",
  'image-png',
] }
# In Tauri 3 the runtime lives in a separate crate; `tauri::Builder::default()`
# is generic over `tauri_runtime::Runtime` and defaults to the type-erased
# `DynRuntime`. The Wry runtime type (`WryRuntime`) and the `Wry` runtime
# initializer both live here.
tauri-runtime-wry = "=3.0.0-alpha.6"
# The rest of the family, declared here only to pin it. Nothing in this crate
# names these crates directly: `tauri` pulls `tauri-runtime`, `tauri-utils` and
# `tauri-macros` (the latter through its `macros` feature), and each
# `tauri-plugin-*` below pulls `tauri-plugin`. Declaring them is the only way to
# stop `cargo update` unifying them forward on its own — a transitive
# requirement is not a place to put an `=`.
tauri-runtime = "=3.0.0-alpha.5"
tauri-utils = "=3.0.0-alpha.4"
tauri-macros = "=3.0.0-alpha.4"
tauri-plugin = "=3.0.0-alpha.4"
# Every `tauri-plugin-*` comes from Tauri's own `plugins-workspace`, `v3`
# branch — the canonical source, tracked at the branch tip so a `cargo update`
# always takes the newest v3 alpha (crates.io carries them too, at alpha.3 /
# alpha.4, built from that branch). The git pin is kept because it follows the
# branch automatically, which is what `scripts/check-transcribe-deps.ts` keeps
# current — and that script now refuses a pin that does not resolve against the
# core above instead of half-applying it.
# `tauri-plugin-macos-permissions` is the exception — it is a community plugin
# with no v3 release at all, so it stays on its fork.
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-os = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-clipboard-manager = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-process = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
rusqlite_migration = "2.6.0"
tauri-plugin-fs = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
cpal = "^0.18.2"
rtrb = "^0.4.1"
anyhow = "1.0.104"
rubato = "^5.1.0"
hound = "3.5.1"
# Decodes MP3 / M4A / FLAC / OGG / multi-channel WAV for the "Transcribe Files"
# page. Same crate + features rodio already pulls in, so no new transitive deps.
symphonia = { version = "^0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "mkv", "wav", "pcm", "adpcm"] }
# Opus (most .ogg / .opus / .webm voice notes), which symphonia cannot decode
# (upstream 1fe3ae2). Builds libopus from source with cmake; the 0.3 line is
# the one for symphonia 0.6, and keeps the 120 ms stereo packets 0.2.3 and
# older dropped.
symphonia-adapter-libopus = "^0.3.0"
log = "^0.4.35"
# process: the transcription hook (transcription_hook.rs); io-util and time
# are what it uses beside it, named so it does not lean on another crate's.
tokio = { version = "^1.54.1", features = ["process", "io-util", "time"] }
# In-app llama.cpp server manager: release archives are unpacked with the
# pure-Rust zip crate (no PowerShell / tar shell-outs).
zip = { version = "^9.7.0", default-features = false, features = ["deflate"] }
# Status-bar meters: one sampler thread, CPU + RAM from sysinfo, GPU from NVML
# when the NVIDIA driver library is present (loaded at runtime, optional).
sysinfo = { version = "^0.40.4", default-features = false, features = ["system"] }
nvml-wrapper = "0.13"
enigo = "0.6.1"
rodio = { git = "https://github.com/RustAudio/rodio" }
reqwest = { version = "^0.13.5", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures-util = "^0.3.34"
# Live FFT page: real-to-complex transform (built on rustfft). Already a
# transitive dependency of rubato, so no new crate is compiled.
realfft = "^3.5.1"
strsim = "0.11.1"
natural = "0.5.0"
regex = "^1.13.2"
# Text-based language ID (filler-word removal fallback); isolang bridges the
# ISO 639-1 codes in model metadata to whatlang's 639-3 codes.
whatlang = "^0.18.0"
isolang = "^2.4.0"
chrono = "0.4.45"
rusqlite = { version = "^0.40.2", features = ["bundled"] }
sha2 = "^0.11.1"
# Every model (Whisper family, Parakeet, Moonshine, Canary, … as GGUF) runs
# through transcribe-cpp (ggml, native backends). Per-platform backend features
# are added in the target tables below.
transcribe-cpp = { version = "*", default-features = false }
handy-keys = "^0.3.5"
ferrous-opencc = "0.4.0"
clap = { version = "^4.6.8", features = ["derive"] }
specta = "2.0.0-rc.28"
specta-typescript = "0.0.15"
tauri-specta = { version = "2.0.0-rc.29", features = ["derive", "typescript"] }
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
hf-hub = { git = "https://github.com/huggingface/hf-hub", branch = "main" }
tokio-util = "^0.7.20"
dirs = "^7.0.0"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
rand = "^0.10.4"

[target.'cfg(unix)'.dependencies]
signal-hook = "^0.4.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-global-shortcut = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v3" }

[target.'cfg(windows)'.dependencies]
# Used to reach ICoreWebView2Settings3 through the webview's controller
# (disabling browser accelerator keys in the main window, upstream #1940).
# Must match the version tauri-runtime-wry links against so the COM types
# are identical — both depend on the same windows-core instance.
webview2-com = "^0.39.1"
# windows-core 0.62 — same minor as what wry 0.57 + webview2-com 0.39 bring
# in, so there is a single windows-core version in the graph and the
# COM `Interface` trait resolves for both our imports and the controller().
# (enigo and tauri-plugin-opener still use windows 0.61, a separate crate
# that does not share COM types with our webview2-com interop.)
windows-core = "0.62"
windows = { version = "^0.62.2", features = [
  "Win32_Media",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  # GlobalizationPreferences::Languages (system_languages.rs): Settings ->
  # Time & Language's list, keyboard-only languages included.
  "Foundation_Collections",
  "System_UserProfile",
] }
winreg = "0.56.0"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
# The model architectures are compiled into libtranscribe rather than shipped as
# loadable `transcribe-arch-<family>.dll` modules: the `arch-dl` module split is
# switched off for now, and so is the family-set selection — every lane packs
# the full set, so one build carries every model and `TRANSCRIBE_MODEL_SET` is
# not a per-lane knob. See scripts/tauri-runner.ts.
#
# `dynamic-backends` stays: that is a different mechanism (ggml backend modules
# — the CPU ISA tiers and `ggml-cuda`), and it is what lets one binary serve a
# CUDA device and a CPU device in the same process. It implies `shared`.
transcribe-cpp = { version = "*", default-features = false, features = [
  "dynamic-backends",
  "cuda",
  "vulkan",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "*", default-features = false }
# libopus's ARM runtime CPU probe (celt/arm/armcpu.c) sees clang-cl's _MSC_VER
# and calls MSVC's __emit, which clang lacks; presuming NEON instead trips a
# libopus CMake bug (celt_inner_prod_neon left undeclared). Plain C, as
# upstream builds it (2696c49, 1472087): decoding Opus files is cheap.
opusic-sys = { version = "^0.7.7", features = ["no-simd"] }

# The engine per macOS arch (upstream 7bfb2e2). Apple Silicon links the Metal
# build. Intel Macs are CPU-only: ggml-metal compiles its embedded shader
# library at backend init (app launch, whatever accelerator is selected), and
# on some AMD GPUs that compile never finishes, hanging every model load.
# With no features, transcribe-cpp-sys sets TRANSCRIBE_METAL=OFF.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "*", default-features = false, features = ["metal"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "*", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "^0.6.5"
objc2-foundation = "^0.3.2"
objc2-app-kit = "^0.3.2"
objc2-service-management = "0.3.2"
core-graphics = "^0.25.0"
core-foundation = "^0.10.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
gtk = "^0.18.2"
# Stays on 0.2: the libc README says to depend on 0.2, the 1.0.0-alpha.*
# tags are v1.0 branch snapshots, and every other crate here uses 0.2 (a
# second libc would be compiled on Linux). update-deps.ts knows this.
libc = "^0.2.191"
# Same posture as Windows x86_64 above: architectures are compiled in on every
# platform (no `arch-dl` anywhere), so every model works — there is just no
# plugin directory to swap a family in or out of.
transcribe-cpp = { version = "*", default-features = false, features = [
  "dynamic-backends",
  "cuda",
  "vulkan",
] }

# tao is no longer patched: the git patch existed for the Wayland client-side
# decorations fix (tao #1218) and the thread event target fix (tao #1274), both
# merged before tao 0.37.0 was published (2026-08-21); `tao` `dev` is the
# published 0.37.2, so crates.io carries everything the patch did. Dropping it
# also drops the duplicated `tao-macros` source that Nix's importCargoLock
# could not vendor.
#
# Specta is no longer patched either: rc.28 / 0.0.15 are published, and the
# tauri-specta fork requires exactly `=2.0.0-rc.28`.
[patch.crates-io]
# The tauri crates are NOT patched: they resolve from crates.io at the versions
# `[dependencies]` above asks for. They were briefly patched from a v3 fork that
# carried one commit — bumping tauri-runtime-wry's wry dependency from 0.56 to
# 0.57 (webview2-com 0.38→0.39, windows 0.61→0.62) ahead of the release. That
# bump is upstream now: published `tauri-runtime-wry 3.0.0-alpha.2` links
# `wry ^0.57.0`, `webview2-com ^0.39` and `windows ^0.62`, which is exactly what
# the fork's commit made it link, so the fork is obsolete and the patch is gone.
# The Windows `webview2-com` / `windows-core` pins above stay valid against it.
tauri-specta = { git = "https://github.com/NairoDorian/tauri-specta-v3" }
tauri-plugin-macos-permissions = { git = "https://github.com/NairoDorian/tauri-plugin-macos-permissions" }
transcribe-cpp = { git = "https://github.com/NairoDorian/transcribe.cpp", branch = "main" }
transcribe-cpp-sys = { git = "https://github.com/NairoDorian/transcribe.cpp", branch = "main" }

[dev-dependencies]
tempfile = "3.27.0"
# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "^1.54.1", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
panic = "unwind"

